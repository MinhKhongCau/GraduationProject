services:
  # 1. FRONTEND SERVICE (Node.js)
  frontend:
    image: ${DOCKERHUB_USERNAME}/frontend-dev:latest
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT_FRONTEND}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    networks:
      - app-network

  # 2. POSTGRES DATABASE (shared by all services)
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME}
      FORUM_DB_NAME: ${FORUM_DB_NAME}
      CHATROOM_DB_NAME: ${CHATROOM_DB_NAME}
      # Internal M2M Auth
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL}
      INTERNAL_CLIENT_ID: ${INTERNAL_CLIENT_ID_BOOKING:-booking_internal_client_id_2024}
      INTERNAL_CLIENT_SECRET: ${INTERNAL_PLAIN_SECRET_BOOKING:-booking_internal_secret_2024}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. REDIS
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 4. RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  # 5. AUTH SERVICE (Java / Spring Boot)
  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service-dev:latest
    container_name: auth-service
    restart: always
    expose:
      - "${PORT_AUTH_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_AUTH_SERVICE}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # RSA Keys
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      # BCrypt-hashed secrets
      - INTERNAL_SECRET_BOOKING=${INTERNAL_SECRET_BOOKING}
      - INTERNAL_SECRET_PAYMENT=${INTERNAL_SECRET_PAYMENT}
      - INTERNAL_SECRET_PROFILE=${INTERNAL_SECRET_PROFILE}
      - INTERNAL_SECRET_ASSESSMENT=${INTERNAL_SECRET_ASSESSMENT}

  # 6. GO SERVICES (Profile, Payment, Booking, Forum)
  profile-service:
    image: ${DOCKERHUB_USERNAME}/profile-service-dev:latest
    container_name: profile-service
    restart: always
    expose:
      - "${PORT_PROFILE_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PROFILE_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PROFILE_SERVICE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${PROFILE_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PROFILE}

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service-dev:latest
    container_name: payment-service
    restart: always
    expose:
      - "${PORT_PAYMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=host=${DB_HOST} user=${DB_USER} password=${DB_PASSWORD} dbname=${PAYMENT_DB_NAME} port=${DB_PORT} sslmode=${DB_SSLMODE}
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PAYMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PAYMENT_SERVICE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${PAYMENT_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PAYMENT}
      # VNPay Sandbox
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET} 
      - VNP_PAYMENT_URL=${VNP_PAYMENT_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}

  booking-service:
    image: ${DOCKERHUB_USERNAME}/booking-service-dev:latest
    container_name: booking-service
    restart: always
    expose:
      - "${PORT_BOOKING_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BOOKING_DB_NAME=${BOOKING_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_BOOKING_SERVICE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${BOOKING_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_BOOKING}

  # 7. ASSESSMENT SERVICE (Python)
  assessment-service:
    image: ${DOCKERHUB_USERNAME}/assessment-service-dev:latest
    container_name: assessment-service
    restart: always
    expose:
      - "${PORT_ASSESSMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ASSESSMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_ASSESSMENT_SERVICE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${ASSESSMENT_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_ASSESSMENT}

  forum-service:
    image: ${DOCKERHUB_USERNAME}/forum-service-dev:latest
    container_name: forum-service
    restart: always
    expose:
      - "${PORT_FORUM_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FORUM_DB_NAME=${FORUM_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_FORUM_SERVICE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${FORUM_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_FORUM}

  # 8. CHATROOM SERVICE (Node.js / Socket.IO)
  # Its Socket.IO transport isn't proxied through Kong (only the
  # /api/v1/chatroom REST routes are gateway-wired, see kong.yml) — the
  # frontend connects to it directly, so unlike the other backend services
  # in this file it needs its port published, not just exposed internally.
  chatroom-service:
    image: ${DOCKERHUB_USERNAME}/chatroom-service-dev:latest
    container_name: chatroom-service
    restart: always
    ports:
      - "${PORT_CHATROOM_SERVICE}:${PORT_CHATROOM_SERVICE}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT_CHATROOM_SERVICE}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - REDIS_URL=redis://redis:6379
      # Verifies the same JWT auth-service signs with, at the Socket.IO
      # handshake (no internal M2M call to auth-service, unlike the other
      # Go services above).
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}

  # 9. API GATEWAY (Kong)
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway-dev:latest
    container_name: api-gateway
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "${PORT_API_GATEWAY}:8000"
    depends_on:
      - auth-service
      - profile-service
      - payment-service
      - booking-service
      - assessment-service
      - chatroom-service
    networks:
      - app-network

  # 10. DOZZLE (system observer - realtime docker log viewer, observer.qmcloud.io.vn)
  # Filtered by compose project label so logs from other projects on this host are hidden.
  # Default project name here is the compose dir name ("dev") — override via COMPOSE_PROJECT_NAME.
  dozzle:
    image: amir20/dozzle:latest
    container_name: mindcare_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-dev}
    ports:
      - "${PORT_DOZZLE}:8080"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
