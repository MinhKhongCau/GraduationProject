services:
  # 1. FRONTEND SERVICE (Node.js)
  frontend:
    image: ${DOCKERHUB_USERNAME}/frontend-production:latest
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT_FRONTEND}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    networks:
      - app-network

  # 2. POSTGRES DATABASE (shared by all services)
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. REDIS
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    restart: always
    expose:
      - "${REDIS_PORT}"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 4. RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    expose:
      - "${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  # 5. AUTH SERVICE (Java / Spring Boot)
  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service-production:latest
    container_name: auth-service
    restart: always
    expose:
      - "${PORT_AUTH_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_AUTH_SERVICE}

  # 6. GO SERVICES (Profile, Payment, Booking)
  profile-service:
    image: ${DOCKERHUB_USERNAME}/profile-service-production:latest
    container_name: profile-service
    restart: always
    expose:
      - "${PORT_PROFILE_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PROFILE_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PROFILE_SERVICE}

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service-production:latest
    container_name: payment-service
    restart: always
    expose:
      - "${PORT_PAYMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PAYMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PAYMENT_SERVICE}

  booking-service:
    image: ${DOCKERHUB_USERNAME}/booking-service-production:latest
    container_name: booking-service
    restart: always
    expose:
      - "${PORT_BOOKING_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${BOOKING_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_BOOKING_SERVICE}

  # 7. ASSESSMENT SERVICE (Python)
  assessment-service:
    image: ${DOCKERHUB_USERNAME}/assessment-service-production:latest
    container_name: assessment-service
    restart: always
    expose:
      - "${PORT_ASSESSMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ASSESSMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_ASSESSMENT_SERVICE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
