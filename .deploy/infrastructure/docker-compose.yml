version: "3.9"

services:

  # ================== POSTGRES ==================
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      # format: psychology_<service name>_db
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-network

  # ================== REDIS ==================
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  # ================== RABBITMQ ==================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
