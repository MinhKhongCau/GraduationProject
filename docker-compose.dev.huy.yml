services:
  # 1. POSTGRES DATABASE (shared by backend services)
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 4. AUTH SERVICE (Java / Spring Boot)
  auth-service:
    build:
      context: ./app/backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    expose:
      - "8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=5432
      - PORT=${PORT_AUTH_SERVICE}
      # RSA Keys
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # BCrypt-hashed secrets
      - INTERNAL_SECRET_BOOKING=${INTERNAL_SECRET_BOOKING:-}
      - INTERNAL_SECRET_PAYMENT=${INTERNAL_SECRET_PAYMENT:-}
      - INTERNAL_SECRET_PROFILE=${INTERNAL_SECRET_PROFILE:-}
      - INTERNAL_SECRET_ASSESSMENT=${INTERNAL_SECRET_ASSESSMENT:-}

  # 5. GO SERVICES (Payment, Booking)
  payment-service:
    build:
      context: ./app/backend/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    expose:
      - "${PORT_PAYMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PAYMENT_DB_NAME=${PAYMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - PORT=${PORT_PAYMENT_SERVICE}
      # VNPay Sandbox
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_PAYMENT_URL=${VNP_PAYMENT_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:8080
      - INTERNAL_CLIENT_ID=payment-service
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PAYMENT:-payment_internal_secret_2024}

  booking-service:
    build:
      context: ./app/backend/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    restart: always
    expose:
      - "${PORT_BOOKING_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BOOKING_DB_NAME=${BOOKING_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=5432
      - PORT=${PORT_BOOKING_SERVICE}

  # 6. API GATEWAY (Kong)
  api-gateway:
    build:
      context: ./app/backend/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
    ports:
      - "${PORT_API_GATEWAY}:8000"
    depends_on:
      - auth-service
      - payment-service
      - booking-service
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
