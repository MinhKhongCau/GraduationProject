services:
  # 1. FRONTEND SERVICE (Next.js)
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT_FRONTEND}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    networks:
      - app-network

  # 2. POSTGRES DATABASE (shared by all services)
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME}
      FORUM_DB_NAME: ${FORUM_DB_NAME}
      CHATBOT_DB_NAME: ${CHATBOT_DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}" ]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. REDIS
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 4. RABBITMQ
  # (idempotent) declare-on-connect calls.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./app/backend/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./app/backend/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && tail -f /dev/null" ]

  # 5. AUTH SERVICE (Java / Spring Boot)
  auth-service:
    build:
      context: ./app/backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - "${PORT_AUTH_SERVICE}:${PORT_AUTH_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=5432
      - PORT=${PORT_AUTH_SERVICE}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      # RSA Keys — set trong .env bằng base64 DER. Để trống = random key (dev only)
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # BCrypt-hashed secrets của từng service nội bộ
      - INTERNAL_SECRET_BOOKING=${INTERNAL_SECRET_BOOKING}
      - INTERNAL_SECRET_PAYMENT=${INTERNAL_SECRET_PAYMENT}
      - INTERNAL_SECRET_PROFILE=${INTERNAL_SECRET_PROFILE}
      - INTERNAL_SECRET_ASSESSMENT=${INTERNAL_SECRET_ASSESSMENT}

  # 6. GO SERVICES (Profile, Payment, Booking)
  profile-service:
    build:
      context: ./app/backend/profile-service
      dockerfile: Dockerfile
    container_name: profile-service
    restart: always
    ports:
      - "${PORT_PROFILE_SERVICE}:${PORT_PROFILE_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PROFILE_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PROFILE_SERVICE}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${PROFILE_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PROFILE}

  payment-service:
    build:
      context: ./app/backend/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "${PORT_PAYMENT_SERVICE}:${PORT_PAYMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=host=${DB_HOST} user=${DB_USER} password=${DB_PASSWORD} dbname=${PAYMENT_DB_NAME} port=5432 sslmode=${DB_SSLMODE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PAYMENT_DB_NAME=${PAYMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - PORT=${PORT_PAYMENT_SERVICE}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:${PORT_AUTH_SERVICE}
      - INTERNAL_CLIENT_ID=${PAYMENT_SERVICE_NAME:-payment-service}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PAYMENT}
      - BOOKING_SERVICE_INTERNAL_URL=http://booking-service:${PORT_BOOKING_SERVICE}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_PAYMENT_URL=${VNP_PAYMENT_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - PAYMENT_ORDER_TTL_MINUTES=${PAYMENT_ORDER_TTL_MINUTES:-15}
      - PAYMENT_MIN_USABLE_WINDOW_SECONDS=${PAYMENT_MIN_USABLE_WINDOW_SECONDS:-60}
      - OUTBOX_POLL_INTERVAL_SECONDS=${OUTBOX_POLL_INTERVAL_SECONDS:-5}
      - OUTBOX_MAX_ATTEMPTS=${OUTBOX_MAX_ATTEMPTS:-10}
      - OUTBOX_BASE_BACKOFF_SECONDS=${OUTBOX_BASE_BACKOFF_SECONDS:-5}
      - OUTBOX_MAX_BACKOFF_SECONDS=${OUTBOX_MAX_BACKOFF_SECONDS:-300}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-50}
      - HOLD_PERIOD_MINUTES=${HOLD_PERIOD_MINUTES:-1}

  booking-service:
    build:
      context: ./app/backend/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    restart: always
    ports:
      - "${PORT_BOOKING_SERVICE}:${PORT_BOOKING_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BOOKING_DB_NAME=${BOOKING_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=5432
      - PORT=${PORT_BOOKING_SERVICE}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:${PORT_AUTH_SERVICE}
      - INTERNAL_CLIENT_ID=${BOOKING_SERVICE_NAME:-booking-service}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_BOOKING}
      - ROLLING_SLOT_DAYS=${ROLLING_SLOT_DAYS:-30}

  # 7. ASSESSMENT SERVICE (Python)
  assessment-service:
    build:
      context: ./app/backend/assessment-service
      dockerfile: Dockerfile
    container_name: assessment-service
    restart: always
    ports:
      - "${PORT_ASSESSMENT_SERVICE}:${PORT_ASSESSMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ASSESSMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_ASSESSMENT_SERVICE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=${AUTH_SERVICE_INTERNAL_URL}
      - INTERNAL_CLIENT_ID=${ASSESSMENT_SERVICE_NAME}
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_ASSESSMENT}

  # 8. FORUM SERVICE (Go)
  # Not yet wired into api-gateway/kong.yml — see app/backend/forum-service/SPEC.md
  # Context for why gateway wiring is deferred. Reachable directly on PORT_FORUM_SERVICE
  # for now.
  forum-service:
    build:
      context: ./app/backend/forum-service
      dockerfile: Dockerfile
    container_name: forum-service
    restart: always
    ports:
      - "${PORT_FORUM_SERVICE:-8084}:${PORT_FORUM_SERVICE:-8084}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${FORUM_DB_NAME:-forum_db}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_FORUM_SERVICE:-8084}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  # 9. CHATROOM SERVICE (Node.js / Socket.IO)
  chatroom-service:
    build:
      context: ./app/backend/chatroom-service
      dockerfile: Dockerfile
    container_name: chatroom-service
    restart: always
    ports:
      - "${PORT_CHATROOM_SERVICE}:${PORT_CHATROOM_SERVICE}"
    depends_on:
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT_CHATROOM_SERVICE}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - REDIS_URL=redis://redis:${REDIS_PORT}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${CHATROOM_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - CHATBOT_URL=${CHATBOT_URL}

  # 10. CHATBOT SERVICE (Python FastAPI)
  chatbot-service:
    build:
      context: ./app/backend/chatbot-service
      dockerfile: Dockerfile
    container_name: chatbot-service
    restart: always
    ports:
      - "${PORT_CHATBOT_SERVICE}:${PORT_CHATBOT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
      ollama:
        # Thêm dependency này
        condition: service_started
    networks:
      - app-network
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_PORT=${DB_PORT}
      - POSTGRES_DB=${CHATBOT_DB_NAME}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMOTION_MODEL_NAME=r-f/wav2vec-english-speech-emotion-recognition
    volumes:
      - ./app/backend/chatbot-service/data:/workspace/data
      - huggingface_cache:/root/.cache/huggingface
    # Thêm healthcheck
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')" ]
      interval: 60s
      timeout: 10s
      retries: 3

  # 11. API GATEWAY (Kong)
  api-gateway:
    platform: linux/amd64
    build:
      context: ./app/backend/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "${PORT_API_GATEWAY}:8000"
    depends_on:
      - auth-service
      - profile-service
      - payment-service
      - booking-service
      - assessment-service
      - chatbot-service
      - chatroom-service
    networks:
      - app-network

  # 12. DOZZLE (system observer - realtime docker log viewer, observer.qmcloud.io.vn)
  # Filtered by compose project label so logs from other projects on this host are hidden.
  dozzle:
    image: amir20/dozzle:latest
    container_name: mindcare_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-graduationproject}
    ports:
      - "${PORT_DOZZLE}:8080"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ollama_data:
  huggingface_cache:

networks:
  app-network:
    driver: bridge
