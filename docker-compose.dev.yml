services:
  # 1. FRONTEND SERVICE (Next.js)
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: always
    ports:
      - "${PORT_FRONTEND}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    networks:
      - app-network

  # 2. POSTGRES DATABASE (shared by all services)
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. REDIS
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 4. RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  # 5. AUTH SERVICE (Java / Spring Boot)
  auth-service:
    build:
      context: ./app/backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    # ✅ SECURITY: Không expose port ra host — chỉ các container cùng network mới thấy
    expose:
      - "8080"  # Chỉ mở trong Docker internal network, không map ra host
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${AUTH_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_AUTH_SERVICE}
      # RSA Keys — set trong .env bằng base64 DER. Để trống = random key (dev only)
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # BCrypt-hashed secrets của từng service nội bộ
      # ⚠️  Thay thế bằng bcrypt hash thực khi deploy production
      - INTERNAL_SECRET_BOOKING=${INTERNAL_SECRET_BOOKING:-}
      - INTERNAL_SECRET_PAYMENT=${INTERNAL_SECRET_PAYMENT:-}
      - INTERNAL_SECRET_PROFILE=${INTERNAL_SECRET_PROFILE:-}
      - INTERNAL_SECRET_ASSESSMENT=${INTERNAL_SECRET_ASSESSMENT:-}

  # 6. GO SERVICES (Profile, Payment, Booking)
  profile-service:
    build:
      context: ./app/backend/profile-service
      dockerfile: Dockerfile
    container_name: profile-service
    restart: always
    ports:
      - "${PORT_PROFILE_SERVICE}:${PORT_PROFILE_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${PROFILE_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_PROFILE_SERVICE}

  payment-service:
    build:
      context: ./app/backend/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "${PORT_PAYMENT_SERVICE}:${PORT_PAYMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_URL=host=${DB_HOST} user=${DB_USER} password=${DB_PASSWORD} dbname=${PAYMENT_DB_NAME} port=${DB_PORT} sslmode=${DB_SSLMODE}
      - PORT=${PORT_PAYMENT_SERVICE}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:8080
      - INTERNAL_CLIENT_ID=payment-service
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_PAYMENT:-payment_internal_secret_2024}

  booking-service:
    build:
      context: ./app/backend/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    restart: always
    ports:
      - "${PORT_BOOKING_SERVICE}:${PORT_BOOKING_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - GO_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BOOKING_DB_NAME=${BOOKING_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_BOOKING_SERVICE}
      # Internal M2M Auth
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:8080
      - INTERNAL_CLIENT_ID=booking-service
      - INTERNAL_CLIENT_SECRET=${INTERNAL_PLAIN_SECRET_BOOKING:-booking_internal_secret_2024}

  # 7. ASSESSMENT SERVICE (Python)
  assessment-service:
    build:
      context: ./app/backend/assessment-service
      dockerfile: Dockerfile
    container_name: assessment-service
    restart: always
    ports:
      - "${PORT_ASSESSMENT_SERVICE}:${PORT_ASSESSMENT_SERVICE}"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - ENV=${APP_ENV}
      - DB_URL=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ASSESSMENT_DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT_ASSESSMENT_SERVICE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  # 8. API GATEWAY (Kong)
  api-gateway:
    build:
      context: ./app/backend/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "${PORT_API_GATEWAY}:8000"
    depends_on:
      - auth-service
      - profile-service
      - payment-service
      - booking-service
      - assessment-service
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
