name: Register Dev

on:
  push:
    branches:
      - main

jobs:
  # Định nghĩa ma trận để build và push tất cả các service song song
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service-name: frontend
            context: ./app/frontend
            dockerfile: ./app/frontend/Dockerfile # Điều chỉnh lại đường dẫn Dockerfile nếu cần
            image-tag: frontend-dev
          - service-name: profile-service
            context: ./app/backend/profile-service
            dockerfile: ./app/backend/profile-service/Dockerfile
            image-tag: profile-service-dev
          - service-name: payment-service
            context: ./app/backend/payment-service
            dockerfile: ./app/backend/payment-service/Dockerfile
            image-tag: payment-service-dev
          - service-name: booking-service
            context: ./app/backend/booking-service
            dockerfile: ./app/backend/booking-service/Dockerfile
            image-tag: booking-service-dev
          - service-name: auth-service
            context: ./app/backend/auth-service
            dockerfile: ./app/backend/auth-service/Dockerfile
            image-tag: auth-service-dev
          - service-name: assessment-service
            context: ./app/backend/assessment-service
            dockerfile: ./app/backend/assessment-service/Dockerfile
            image-tag: assessment-service-dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Khởi tạo Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push kèm cấu hình Cache Buildx (gha)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image-tag }}:latest
          
          # Cấu hình Cache ma thuật bằng Buildx qua GitHub Actions Cache (gha)
          cache-from: type=gha,scope=${{ matrix.service-name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service-name }}