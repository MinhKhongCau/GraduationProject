version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      # format: psychology_<service name>_db
      POSTGRES_DB: psychology_assessment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
