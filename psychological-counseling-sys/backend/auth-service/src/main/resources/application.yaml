server:
  port: 8081 # Đổi port sang 8081 để không bị đụng với Golang đang chạy cổng 8080

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5434/auth_db 
    username: root          
    password: rootpassword  
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true     
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Kéo chữ jwt ra SÁT LỀ TRÁI, ngang hàng với chữ spring và server
jwt:
  # Một chuỗi mã hóa ngẫu nhiên (Hex 256-bit) làm khóa bí mật. TUYỆT ĐỐI KHÔNG để lộ chuỗi này!
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 900000 # 15 phút (tính bằng milliseconds)
  refresh-token-expiration: 604800000 # 7 ngày (tính bằng milliseconds)