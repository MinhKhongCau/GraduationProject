version: '3.8'

services:
  # 1. Cơ sở dữ liệu chính (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: mindcare_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      # Mặc định tạo sẵn DB cho booking, các DB khác ta sẽ tạo sau
      POSTGRES_DB: booking_db 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Hệ thống Cache & Lock (Redis) - Rất quan trọng cho Booking Service
  redis:
    image: redis:7-alpine
    container_name: mindcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. Hệ thống Message Broker (RabbitMQ) - Dùng để giao tiếp giữa Golang và Spring Boot
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mindcare_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"   # Cổng giao tiếp nội bộ
      - "15672:15672" # Cổng giao diện quản lý (UI)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: