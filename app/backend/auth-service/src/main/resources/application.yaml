server:
  port: ${PORT:8080} # Mặc định 8081 khi chạy local để không bị đụng với Golang đang chạy cổng 8080

spring:
  application:
    name: auth-service

  datasource:
    # url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5434}/${DB_NAME:auth_db}?sslmode=${DB_SSLMODE:disable}
    url: jdbc:postgresql://${DB_URL:localhost}:5434/${DB_NAME:auth_db}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Kéo chữ jwt ra SÁT LỀ TRÁI, ngang hàng với chữ spring và server
jwt:
  # Một chuỗi mã hóa ngẫu nhiên (Hex 256-bit) làm khóa bí mật. TUYỆT ĐỐI KHÔNG để lộ chuỗi này!
  secret:
    404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    # access-token-expiration: 900000 # 15 phút (tính bằng milliseconds)
  access-token-expiration: 4320000000 # 50 ngày (tính bằng milliseconds)
  refresh-token-expiration: 604800000 # 7 ngày (tính bằng milliseconds)
