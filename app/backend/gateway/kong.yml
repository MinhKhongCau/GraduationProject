_format_version: "3.0"
_transform: true

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY: Chặn hoàn toàn /internal/* từ Internet.
  # Path này chỉ được gọi trong Docker internal network (container-to-container).
  # Route này phải khai báo TRƯỚC các route service khác để được match ưu tiên.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: block-internal-routes
    # Dummy URL — request sẽ bị terminated trước khi forward đến đây
    url: http://auth-service:8080
    routes:
      - name: block-internal
        paths:
          - /internal
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 403
              body: '{"message":"Forbidden: /internal paths are not accessible from outside the network"}'
              content_type: "application/json"

  # ═══════════════════════════════════════════════════════════════════════════
  # Trang chủ gateway ("/" và "/index.html"): liệt kê link Swagger của từng service.
  # Kong trả HTML trực tiếp bằng request-termination, không forward tới service nào.
  # Link dùng path tương đối nên chạy được cả ở localhost:8000 lẫn domain production.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: gateway-index
    # Dummy URL — request bị terminate trước khi forward
    url: http://auth-service:8080
    routes:
      - name: gateway-index
        paths:
          - "~/$"
          - "~/index\\.html$"
        strip_path: false
        methods:
          - GET
          - HEAD
        plugins:
          - name: request-termination
            config:
              status_code: 200
              content_type: "text/html; charset=utf-8"
              body: |
                <!doctype html>
                <html lang="vi">
                <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>MindCare API Gateway</title>
                <style>
                  :root { --bg: #f7f8fa; --card: #ffffff; --text: #111827; --muted: #6b7280; --border: #e5e7eb; --accent: #0f766e; }
                  @media (prefers-color-scheme: dark) {
                    :root { --bg: #0b0f14; --card: #131a22; --text: #e5e7eb; --muted: #9ca3af; --border: #243041; --accent: #2dd4bf; }
                  }
                  * { box-sizing: border-box; }
                  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
                  main { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
                  h1 { margin: 0 0 4px; font-size: 26px; }
                  p.lead { margin: 0 0 32px; color: var(--muted); }
                  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
                  a.card { display: block; height: 100%; padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s; }
                  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
                  .name { font-weight: 600; }
                  .desc { margin-top: 4px; font-size: 13px; color: var(--muted); }
                  code { font-size: 12px; color: var(--accent); }
                  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
                </style>
                </head>
                <body>
                <main>
                  <h1>MindCare API Gateway</h1>
                  <p class="lead">Tài liệu API (Swagger / OpenAPI) của từng service. API gọi qua gateway tại <code>/api/v1/...</code>.</p>
                  <ul>
                    <li><a class="card" href="/auth/swagger-ui/index.html"><div class="name">Auth Service</div><div class="desc">Đăng ký, đăng nhập, JWT, tài khoản.</div><code>/auth/swagger-ui/index.html</code></a></li>
                    <li><a class="card" href="/profile/swagger-ui/index.html"><div class="name">Profile Service</div><div class="desc">Hồ sơ bệnh nhân, chuyên gia, chuyên khoa.</div><code>/profile/swagger-ui/index.html</code></a></li>
                    <li><a class="card" href="/booking/swagger-ui/index.html"><div class="name">Booking Service</div><div class="desc">Lịch làm việc, slot, lịch hẹn, bệnh án.</div><code>/booking/swagger-ui/index.html</code></a></li>
                    <li><a class="card" href="/payment/swagger-ui/index.html"><div class="name">Payment Service</div><div class="desc">VNPay, ví, giao dịch, rút tiền.</div><code>/payment/swagger-ui/index.html</code></a></li>
                    <li><a class="card" href="/assessment/swagger-ui"><div class="name">Assessment Service</div><div class="desc">Bài đánh giá tâm lý, câu hỏi, kết quả.</div><code>/assessment/swagger-ui</code></a></li>
                    <li><a class="card" href="/forum/swagger-ui/index.html"><div class="name">Forum Service</div><div class="desc">Bài viết, bình luận, thẻ cộng đồng.</div><code>/forum/swagger-ui/index.html</code></a></li>
                    <li><a class="card" href="/chatroom/api-docs"><div class="name">Chatroom Service</div><div class="desc">Tin nhắn trực tiếp (Socket.IO).</div><code>/chatroom/api-docs</code></a></li>
                  </ul>
                  <footer>Trang này do Kong trả về trực tiếp (route <code>gateway-index</code> trong <code>kong.yml</code>).</footer>
                </main>
                </body>
                </html>

  - name: auth-service
    url: http://auth-upstream
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: auth-docs-routes
        paths:
          - /auth
        strip_path: true
      - name: auth-docs-spec-routes
        # springdoc luôn nạp spec từ path tuyệt đối "/v3/api-docs"
        paths:
          - /v3/api-docs
        strip_path: false

  - name: profile-service
    url: http://profile-upstream
    routes:
      - name: profile-routes
        paths:
          - /api/v1/profiles
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: profile-docs-routes
        paths:
          - /profile
        strip_path: true

  - name: payment-service
    url: http://payment-upstream
    routes:
      - name: payment-public-routes
        paths:
          - /api/v1/payments/vnpay-ipn
          # FE trang kết quả chuyển tiếp query VNPay; được xác thực bằng vnp_SecureHash, không cần JWT
          # (trên app native, trình duyệt thanh toán không có phiên đăng nhập).
          - /api/v1/payments/vnpay-return
        strip_path: false
      - name: payment-private-routes
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: payment-docs-routes
        paths:
          - /payment
        strip_path: true

  - name: booking-service
    url: http://booking-upstream
    routes:
      - name: booking-public-routes
        paths:
          - /api/v1/public/booking
        strip_path: false
      - name: booking-private-routes
        paths:
          - /api/v1/booking
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: booking-docs-routes
        paths:
          - /booking
        strip_path: true

  - name: assessment-service
    url: http://assessment-upstream
    routes:
      - name: assessment-routes
        paths:
          - /api/v1/assessments
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: assessment-docs-routes
        paths:
          - /assessment
        strip_path: true
      - name: assessment-docs-spec-routes
        # FastAPI luôn nạp openapi.json/redoc từ path tuyệt đối
        paths:
          - /openapi.json
          - /redoc
        strip_path: false

  - name: forum-service
    url: http://forum-upstream
    routes:
      - name: forum-public-routes
        paths:
          - /api/v1/forum
        methods:
          - GET
          - OPTIONS
        strip_path: false
      - name: forum-private-bookmarks-route
        paths:
          - /api/v1/forum/users/me/bookmarks
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: forum-private-routes
        paths:
          - /api/v1/forum
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: forum-docs-routes
        paths:
          - /forum
        strip_path: true

  - name: chatroom-service
    url: http://chatroom-upstream
    routes:
      - name: chatroom-routes
        paths:
          - /api/v1/chatroom
        strip_path: false
      - name: chatroom-socket-routes
        paths:
          - /socket.io
        strip_path: false
      - name: chatroom-docs-routes
        paths:
          - /chatroom
        strip_path: true
        
  - name: chatbot-service
    url: http://chatbot-upstream
    routes:
      - name: chatbot-routes
        paths:
          - /api/v1/chat
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8080
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2
      passive:
        unhealthy:
          http_failures: 3

  - name: profile-upstream
    targets:
      - target: profile-service:8081
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: payment-upstream
    targets:
      - target: payment-service:8082
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: booking-upstream
    targets:
      # - target: host.docker.internal:8083
      - target: booking-service:8083

    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: assessment-upstream
    targets:
      - target: assessment-service:5000
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: forum-upstream
    targets:
      - target: forum-service:8084
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: chatroom-upstream
    targets:
      - target: chatroom-service:8085
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: chatbot-upstream
    targets:
      - target: chatbot-service:8086

plugins:
  # Cấu hình CORS toàn cục
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - https://sandbox.qmcloud.io.vn
        - http://sandbox.qmcloud.io.vn
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-User-Id
        - X-User-Role
        - X-User-Email
      exposed_headers:
        - X-User-Id
        - X-User-Role
        - X-User-Email
      credentials: true
      max_age: 3600

  # Cấu hình giới hạn request (Rate Limiting) toàn cục
  - name: rate-limiting
    config:
      second: 20
      minute: 200
      policy: local
