_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-upstream
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: auth-docs-routes
        paths:
          - /auth
        strip_path: true
      - name: auth-docs-spec-routes
        # springdoc luôn nạp spec từ path tuyệt đối "/v3/api-docs"
        paths:
          - /v3/api-docs
        strip_path: false

  - name: profile-service
    url: http://profile-upstream
    routes:
      - name: profile-routes
        paths:
          - /api/v1/profiles
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              jwt_secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      - name: profile-docs-routes
        paths:
          - /profile
        strip_path: true

  - name: payment-service
    url: http://payment-upstream
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payment
        strip_path: false
      - name: payment-docs-routes
        paths:
          - /payment
        strip_path: true

  - name: booking-service
    url: http://booking-upstream
    routes:
      - name: booking-public-routes
        paths:
          - /api/v1/public/booking
        strip_path: false
      - name: booking-private-routes
        paths:
          - /api/v1/booking
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              jwt_secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      - name: booking-docs-routes
        paths:
          - /booking
        strip_path: true

  - name: assessment-service
    url: http://assessment-upstream
    routes:
      - name: assessment-routes
        paths:
          - /api/v1/assessments
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              jwt_secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      - name: assessment-docs-routes
        paths:
          - /assessment
        strip_path: true
      - name: assessment-docs-spec-routes
        # FastAPI luôn nạp openapi.json/redoc từ path tuyệt đối
        paths:
          - /openapi.json
          - /redoc
        strip_path: false

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8080
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2
      passive:
        unhealthy:
          http_failures: 3

  - name: profile-upstream
    targets:
      - target: profile-service:8081
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: payment-upstream
    targets:
      - target: payment-service:8082
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: booking-upstream
    targets:
      # - target: host.docker.internal:8083
      - target: booking-service:8083

    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: assessment-upstream
    targets:
      - target: assessment-service:5000
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

plugins:
  # Cấu hình CORS toàn cục
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - https://sandbox.qmcloud.io.vn
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-User-Id
        - X-User-Role
        - X-User-Email
      exposed_headers:
        - X-User-Id
        - X-User-Role
        - X-User-Email
      credentials: true
      max_age: 3600

  # Cấu hình giới hạn request (Rate Limiting) toàn cục
  - name: rate-limiting
    config:
      second: 20
      minute: 200
      policy: local
