_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-upstream
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false

  - name: profile-service
    url: http://profile-upstream
    routes:
      - name: profile-routes
        paths:
          - /api/v1/profile
        strip_path: false

  - name: payment-service
    url: http://payment-upstream
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payment
        strip_path: false

  - name: booking-service
    url: http://booking-upstream
    routes:
      - name: booking-public-routes
        paths:
          - /api/v1/slots/available-dates
          - /api/v1/slots/available-times
        strip_path: false
      - name: booking-private-routes
        paths:
          - /api/v1/appointments
          - /api/v1/slots/generate
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              jwt_secret: "my_super_secret_key_12345678901234567890"

  - name: assessment-service
    url: http://assessment-upstream
    routes:
      - name: assessment-routes
        paths:
          - /api/v1/assessments
        strip_path: false

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8080
      - target: host.docker.internal:8080 # Fallback cho chạy local ngoài Docker
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2
      passive:
        unhealthy:
          http_failures: 3

  - name: profile-upstream
    targets:
      - target: profile-service:8081
      - target: host.docker.internal:8081
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: payment-upstream
    targets:
      - target: payment-service:8082
      - target: host.docker.internal:8082
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: booking-upstream
    targets:
      - target: booking-service:8083
      - target: host.docker.internal:8083
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

  - name: assessment-upstream
    targets:
      - target: assessment-service:5000
      - target: host.docker.internal:5000
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          timeouts: 2

plugins:
  # Cấu hình CORS toàn cục
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-User-Id
        - X-User-Role
      exposed_headers:
        - X-User-Id
        - X-User-Role
      credentials: true
      max_age: 3600

  # Cấu hình giới hạn request (Rate Limiting) toàn cục
  - name: rate-limiting
    config:
      second: 20
      minute: 200
      policy: local
