_format_version: "3.0"
_transform: true

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY: Chặn hoàn toàn /internal/* từ Internet.
  # Path này chỉ được gọi trong Docker internal network (container-to-container).
  # Route này phải khai báo TRƯỚC các route service khác để được match ưu tiên.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: block-internal-routes
    # Dummy URL — request sẽ bị terminated trước khi forward đến đây
    url: http://auth-service:8080
    routes:
      - name: block-internal
        paths:
          - /internal
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 403
              body: '{"message":"Forbidden: /internal paths are not accessible from outside the network"}'
              content_type: "application/json"

  - name: auth-service
    url: http://auth-upstream
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: auth-docs-routes
        paths:
          - /auth
        strip_path: true
      - name: auth-docs-spec-routes
        # springdoc luôn nạp spec từ path tuyệt đối "/v3/api-docs"
        paths:
          - /v3/api-docs
        strip_path: false

  - name: profile-service
    url: http://profile-upstream
    routes:
      - name: profile-routes
        paths:
          - /api/v1/profiles
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: profile-docs-routes
        paths:
          - /profile
        strip_path: true

  - name: payment-service
    url: http://payment-upstream
    routes:
      - name: payment-public-routes
        paths:
          - /api/v1/payments/vnpay-ipn
        strip_path: false
      - name: payment-private-routes
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: payment-docs-routes
        paths:
          - /payment
        strip_path: true

  - name: booking-service
    url: http://booking-upstream
    routes:
      - name: booking-public-routes
        paths:
          - /api/v1/public/booking
        strip_path: false
      - name: booking-private-routes
        paths:
          - /api/v1/booking
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: booking-docs-routes
        paths:
          - /booking
        strip_path: true

  - name: assessment-service
    url: http://assessment-upstream
    routes:
      - name: assessment-routes
        paths:
          - /api/v1/assessments
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: assessment-docs-routes
        paths:
          - /assessment
        strip_path: true
      - name: assessment-docs-spec-routes
        # FastAPI luôn nạp openapi.json/redoc từ path tuyệt đối
        paths:
          - /openapi.json
          - /redoc
        strip_path: false

  - name: forum-service
    url: http://forum-upstream
    routes:
      - name: forum-public-routes
        paths:
          - /api/v1/forum
        methods:
          - GET
          - OPTIONS
        strip_path: false
      - name: forum-private-bookmarks-route
        paths:
          - /api/v1/forum/users/me/bookmarks
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: forum-private-routes
        paths:
          - /api/v1/forum
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"
      - name: forum-docs-routes
        paths:
          - /forum
        strip_path: true

  - name: chatroom-service
    url: http://chatroom-upstream
    routes:
      - name: chatroom-routes
        paths:
          - /api/v1/chatroom
        strip_path: false
      - name: chatroom-socket-routes
        paths:
          - /socket.io
        strip_path: false
      - name: chatroom-docs-routes
        paths:
          - /chatroom
        strip_path: true
        
  - name: chatbot-service
    url: http://chatbot-upstream
    routes:
      - name: chatbot-routes
        paths:
          - /api/v1/chat
        strip_path: false
        plugins:
          - name: mindcare-auth
            config:
              auth_service_url: "http://auth-service:8080/api/v1/auth/public-key"

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8080
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2
      passive:
        unhealthy:
          http_failures: 3

  - name: profile-upstream
    targets:
      - target: profile-service:8081
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: payment-upstream
    targets:
      - target: payment-service:8082
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: booking-upstream
    targets:
      # - target: host.docker.internal:8083
      - target: booking-service:8083

    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: assessment-upstream
    targets:
      - target: assessment-service:5000
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: forum-upstream
    targets:
      - target: forum-service:8084
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: chatroom-upstream
    targets:
      - target: chatroom-service:8085
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 60
          successes: 2
        unhealthy:
          interval: 60
          http_failures: 2
          timeouts: 2

  - name: chatbot-upstream
    targets:
      - target: chatbot-service:8086

plugins:
  # Cấu hình CORS toàn cục
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - https://sandbox.qmcloud.io.vn
        - http://sandbox.qmcloud.io.vn
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-User-Id
        - X-User-Role
        - X-User-Email
      exposed_headers:
        - X-User-Id
        - X-User-Role
        - X-User-Email
      credentials: true
      max_age: 3600

  # Cấu hình giới hạn request (Rate Limiting) toàn cục
  - name: rate-limiting
    config:
      second: 20
      minute: 200
      policy: local
