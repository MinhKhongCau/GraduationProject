# Code generation config. NOT run in CI yet — each service generates its own
# stubs (see README.md "Generate stubs"). Output goes to gen/ (git-ignored).
version: v2
clean: true
inputs:
  - directory: .
plugins:
  # Go: booking-service, payment-service, profile-service, forum-service
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative

  # Java: auth-service (Spring Boot). Usually generated by protobuf-maven-plugin instead.
  - remote: buf.build/protocolbuffers/java
    out: gen/java
  - remote: buf.build/grpc/java
    out: gen/java

  # Python: assessment-service, chatbot-service
  - remote: buf.build/protocolbuffers/python
    out: gen/python
  - remote: buf.build/grpc/python
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi
    out: gen/python

  # Node.js: chatroom-service (ESM). Alternative: load .proto at runtime with @grpc/proto-loader.
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt: target=js+dts,import_extension=js
