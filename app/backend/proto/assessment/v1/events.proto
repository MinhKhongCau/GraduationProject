syntax = "proto3";

package mindcare.assessment.v1;

import "assessment/v1/assessment.proto";

option go_package = "github.com/MinhKhongCau/GraduationProject/app/backend/proto/gen/go/assessment/v1;assessmentv1";
option java_multiple_files = true;
option java_package = "com.mindcare.proto.assessment.v1";

// Integration events published by assessment-service through its outbox.
// Exchange: assessment.exchange (topic). Wrapped in mindcare.common.v1.EventEnvelope.

// routing key: assessment.completed — after POST /submit is persisted.
// Consumers: chatbot (personalization), notification.
message AssessmentCompleted {
  string result_id = 1;
  string user_id = 2;
  string template_code = 3;
  int32 total_score = 4;
  repeated DimensionScore dimension_scores = 5;
}

// routing key: assessment.high_risk_detected — at least one dimension hit the
// most severe level. Consumers: notification (suggest booking an expert).
message AssessmentHighRiskDetected {
  string result_id = 1;
  string user_id = 2;
  string template_code = 3;
  repeated DimensionScore severe_dimensions = 4;
}
