// Hợp đồng gRPC nội bộ giữa booking-service, payment-service (client) và profile-service (server).
// Chỉ dùng trong mạng Docker nội bộ, KHÔNG public qua API Gateway.
//
// Sinh code: chạy scripts/gen-proto.sh ở thư mục gốc repo. Code sinh ra được commit vào
// từng service (internal/infrastructure/grpc/profilepb) vì mỗi service build với Docker
// context riêng.
syntax = "proto3";

package mindcare.profile.v1;

service ProfileQueryService {
  // GetBookingInfo trả về thông tin cần cho trang xác nhận đặt lịch và lúc tạo cuộc hẹn:
  // chuyên gia, hồ sơ người khám (phải thuộc owner_id) và chuyên khoa đã chọn (nếu có).
  //
  // Lỗi:
  //   INVALID_ARGUMENT    - id không phải UUID hợp lệ
  //   NOT_FOUND           - không có chuyên gia, hoặc hồ sơ không tồn tại/không thuộc owner_id
  //   FAILED_PRECONDITION - chuyên gia không phụ trách chuyên khoa specialization_id
  rpc GetBookingInfo(GetBookingInfoRequest) returns (GetBookingInfoResponse);

  // ListManagedExpertIds trả về auth account id của các chuyên gia do admin_id quản lý
  // (Admin đã duyệt VERIFIED chuyên gia đó). payment-service dùng để giới hạn phạm vi
  // giao dịch Admin được xem/xử lý.
  //
  // Lỗi:
  //   INVALID_ARGUMENT - admin_id không phải UUID hợp lệ
  rpc ListManagedExpertIds(ListManagedExpertIdsRequest) returns (ListManagedExpertIdsResponse);

  // GetProfileSummaries trả thông tin hiển thị (tên, ảnh, liên hệ) của nhiều tài khoản một lần,
  // dùng để ghép tên chuyên gia/bệnh nhân vào lịch hẹn và giao dịch. Id không tồn tại bị bỏ qua;
  // tối đa 100 id mỗi lần.
  //
  // Lỗi:
  //   INVALID_ARGUMENT - có id không phải UUID hoặc quá 100 id
  rpc GetProfileSummaries(GetProfileSummariesRequest) returns (GetProfileSummariesResponse);
}

message ListManagedExpertIdsRequest {
  // Auth account id của Admin.
  string admin_id = 1;
}

message ListManagedExpertIdsResponse {
  repeated string expert_ids = 1;
}

message GetBookingInfoRequest {
  // Auth account id của chuyên gia (chính là expert_id trong booking-service).
  string expert_id = 1;
  // Id hồ sơ người khám (patient_records.record_id).
  string patient_record_id = 2;
  // Auth account id của người đặt lịch; hồ sơ phải thuộc tài khoản này.
  string owner_id = 3;
  // Tuỳ chọn: chuyên khoa bệnh nhân chọn ở bước đầu.
  string specialization_id = 4;
}

message GetBookingInfoResponse {
  ExpertSummary expert = 1;
  PatientRecord patient_record = 2;
  // Chỉ có giá trị khi request truyền specialization_id.
  Specialization specialization = 3;
}

message ExpertSummary {
  string expert_id = 1;
  string full_name = 2;
  string avatar_url = 3;
  string email = 4;
  string verification_status = 5;
  repeated Specialization specializations = 6;
}

message Specialization {
  string spec_id = 1;
  string code = 2;
  string name = 3;
}

message PatientRecord {
  string record_id = 1;
  string owner_id = 2;
  string full_name = 3;
  // YYYY-MM-DD, rỗng nếu chưa khai báo.
  string date_of_birth = 4;
  // MALE / FEMALE / OTHER, rỗng nếu chưa khai báo.
  string gender = 5;
  string phone_number = 6;
  string email = 7;
  string address = 8;
  // SELF / PARENT / CHILD / SPOUSE / SIBLING / RELATIVE / OTHER
  string relationship = 9;
}

message GetProfileSummariesRequest {
  // Auth account id (profiles.auth_id).
  repeated string auth_ids = 1;
}

message GetProfileSummariesResponse {
  repeated ProfileSummary profiles = 1;
}

message ProfileSummary {
  string auth_id = 1;
  // PATIENT / EXPERT / ADMIN
  string role = 2;
  string full_name = 3;
  string avatar_url = 4;
  string email = 5;
  string phone_number = 6;
  // Chỉ có giá trị với chuyên gia.
  string verification_status = 7;
}
