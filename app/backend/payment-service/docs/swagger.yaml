basePath: /api/v1
definitions:
  handler.AdminProcessRequest:
    properties:
      note:
        type: string
    type: object
  handler.CreateOrderRequest:
    properties:
      appointment_id:
        description: Booking appointment ID to pay with VNPay.
        example: dddddddd-dddd-4ddd-8ddd-dddddddddddd
        type: string
    required:
    - appointment_id
    type: object
  handler.CreateOrderResponse:
    properties:
      commission_amount:
        type: integer
      expires_at:
        type: integer
      gross_amount:
        type: integer
      net_amount:
        type: integer
      order_id:
        type: string
      payment_url:
        type: string
      status:
        type: string
    type: object
  handler.CreateWithdrawalRequest:
    properties:
      amount:
        type: integer
      bank_account_id:
        type: string
    required:
    - amount
    - bank_account_id
    type: object
  handler.LinkBankAccountRequest:
    properties:
      account_holder_name:
        type: string
      account_number:
        type: string
      bank_code:
        type: string
    required:
    - account_holder_name
    - account_number
    - bank_code
    type: object
  handler.TopUpRequest:
    properties:
      amount:
        type: integer
    required:
    - amount
    type: object
  handler.WithdrawalResponse:
    properties:
      amount:
        type: integer
      id:
        type: string
      requested_at:
        type: integer
      requires_manual_approval:
        type: boolean
      status:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Hệ thống thanh toán và ví điện tử - MindCare
  title: Payment Service API
  version: "1.0"
paths:
  /payments/admin/withdrawals:
    get:
      parameters:
      - description: Expert UUID
        in: query
        name: expert_id
        type: string
      - description: Withdrawal status
        in: query
        name: status
        type: string
      - description: Start date YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: Zero-based page
        in: query
        name: page
        type: integer
      - description: Page size, 1-100
        in: query
        name: size
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: '[ADMIN] List withdrawals'
      tags:
      - Admin - Withdrawals
  /payments/bank-accounts:
    get:
      description: Retrieve all linked bank accounts for the current expert. Requires
        EXPERT role.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[EXPERT] Get linked bank accounts'
      tags:
      - Withdrawals & Bank Accounts
    post:
      consumes:
      - application/json
      description: Link a new bank account for withdrawals. Requires EXPERT role.
      parameters:
      - description: Thông tin tài khoản ngân hàng để liên kết
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LinkBankAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[EXPERT] Link a new bank account'
      tags:
      - Withdrawals & Bank Accounts
  /payments/compensation-cases:
    get:
      parameters:
      - description: MANUAL_REVIEW or REFUND_REQUIRED
        in: query
        name: status
        type: string
      - description: Appointment UUID
        in: query
        name: appointment_id
        type: string
      - description: Payment order UUID
        in: query
        name: payment_order_id
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size, maximum 100
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[ADMIN] List payment compensation cases'
      tags:
      - Admin - Payments
  /payments/compensation-cases/{id}:
    get:
      parameters:
      - description: Compensation case UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[ADMIN] Get a payment compensation case'
      tags:
      - Admin - Payments
  /payments/orders:
    get:
      parameters:
      - default: '"dddddddd-dddd-4ddd-8ddd-dddddddddddd"'
        description: Appointment UUID
        example: '"dddddddd-dddd-4ddd-8ddd-dddddddddddd"'
        in: query
        name: appointment_id
        type: string
      - default: '"PENDING"'
        description: PENDING, SUCCESS, FAILED, EXPIRED
        example: '"PENDING"'
        in: query
        name: status
        type: string
      - description: Fulfillment status
        in: query
        name: fulfillment_status
        type: string
      - default: '"2026-07-01"'
        description: Start date YYYY-MM-DD
        example: '"2026-07-01"'
        in: query
        name: from
        type: string
      - default: '"2026-07-30"'
        description: End date YYYY-MM-DD
        example: '"2026-07-30"'
        in: query
        name: to
        type: string
      - default: 0
        description: Zero-based page
        example: 0
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size, 1-100
        example: 20
        in: query
        name: size
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: '[PATIENT] List own payment orders'
      tags:
      - Payments
    post:
      consumes:
      - application/json
      description: Create a VNPay payment order for a booking appointment. Payer comes
        from X-User-Id; expert and amount come from Booking Service.
      parameters:
      - description: Appointment payment order payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrderRequest'
      - description: User ID populated by API Gateway from token
        in: header
        name: X-User-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.CreateOrderResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[PATIENT/SYSTEM] Create a new payment order'
      tags:
      - Payment Orders
  /payments/orders/{id}:
    get:
      parameters:
      - description: Payment order UUID
        in: path
        name: id
        required: true
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: '[PATIENT/ADMIN] Get payment order status'
      tags:
      - Payments
  /payments/vnpay-ipn:
    get:
      description: 'VNPay calls this API to update the payment status of an order.
        Role: Public (no token required, verifies checksum).'
      parameters:
      - description: VNPay automated response parameters
        in: query
        name: queryParams
        type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[PUBLIC/WEBHOOK] Receive VNPay payment webhook (IPN)'
      tags:
      - Payment Orders
  /payments/wallets/history:
    get:
      parameters:
      - description: Transaction type
        in: query
        name: type
        type: string
      - description: CREDIT or DEBIT
        in: query
        name: direction
        type: string
      - description: Start date YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: Zero-based page
        in: query
        name: page
        type: integer
      - description: Page size, 1-100
        in: query
        name: size
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: '[PATIENT/EXPERT] Get paginated wallet history'
      tags:
      - Wallets
  /payments/wallets/me:
    get:
      consumes:
      - application/json
      description: Retrieve wallet information (available balance, pending balance,
        locked balance) for the current user. Requires PATIENT or EXPERT role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[PATIENT/EXPERT] Get current user''s wallet'
      tags:
      - Wallets
  /payments/wallets/top-up:
    post:
      consumes:
      - application/json
      description: Directly top up the available balance of the current user's wallet.
        Requires PATIENT or EXPERT role.
      parameters:
      - description: Thông tin nạp tiền
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.TopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[PATIENT/EXPERT] Top up wallet (Dev/Test only)'
      tags:
      - Wallets
  /payments/withdrawals:
    get:
      parameters:
      - description: Withdrawal status
        in: query
        name: status
        type: string
      - description: Start date YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: Zero-based page
        in: query
        name: page
        type: integer
      - description: Page size, 1-100
        in: query
        name: size
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: '[EXPERT] List own withdrawals'
      tags:
      - Withdrawals
    post:
      consumes:
      - application/json
      description: Request a withdrawal to a linked bank account. Amounts < 5,000,000
        VND are auto-approved. Requires EXPERT role.
      parameters:
      - description: Thông tin yêu cầu rút tiền
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateWithdrawalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.WithdrawalResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[EXPERT] Request a withdrawal'
      tags:
      - Withdrawals & Bank Accounts
  /payments/withdrawals/{id}:
    get:
      parameters:
      - description: Withdrawal UUID
        in: path
        name: id
        required: true
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: '[EXPERT/ADMIN] Get withdrawal detail'
      tags:
      - Withdrawals
  /payments/withdrawals/{id}/approve:
    post:
      consumes:
      - application/json
      description: Admin approves a pending withdrawal request. Funds are transferred
        via Payout Gateway. Requires ADMIN role.
      parameters:
      - description: Mã yêu cầu rút tiền (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin ghi chú duyệt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AdminProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[ADMIN] Approve withdrawal request'
      tags:
      - Admin - Withdrawals
  /payments/withdrawals/{id}/reject:
    post:
      consumes:
      - application/json
      description: Admin rejects a pending withdrawal request. Locked funds are returned
        to the expert's wallet. Requires ADMIN role.
      parameters:
      - description: Mã yêu cầu rút tiền (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Lý do từ chối (bắt buộc)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AdminProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[ADMIN] Reject withdrawal request'
      tags:
      - Admin - Withdrawals
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
