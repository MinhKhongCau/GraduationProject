basePath: /api/v1
definitions:
  internal_payment_handler.CreateOrderRequest:
    properties:
      amount:
        type: integer
      expert_id:
        type: string
      gateway:
        description: VNPAY | MOMO | MOCK
        type: string
      payer_id:
        type: string
    required:
    - amount
    - expert_id
    - gateway
    - payer_id
    type: object
  internal_payment_handler.CreateOrderResponse:
    properties:
      commission_amount:
        type: integer
      gross_amount:
        type: integer
      net_amount:
        type: integer
      order_id:
        type: string
      payment_url:
        type: string
      status:
        type: string
    type: object
  internal_wallet_handler.TopUpRequest:
    properties:
      amount:
        type: integer
    required:
    - amount
    type: object
  internal_wallet_handler.TxResponse:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      created_at:
        type: integer
      id:
        type: string
      idempotency_key:
        type: string
      reference_id:
        type: string
      reference_type:
        type: string
      type:
        type: string
      wallet_id:
        type: string
    type: object
  internal_withdrawal_handler.AdminProcessRequest:
    properties:
      note:
        type: string
    type: object
  internal_withdrawal_handler.CreateWithdrawalRequest:
    properties:
      amount:
        type: integer
      bank_account_id:
        type: string
    required:
    - amount
    - bank_account_id
    type: object
  internal_withdrawal_handler.LinkBankAccountRequest:
    properties:
      account_holder_name:
        type: string
      account_number:
        type: string
      bank_code:
        type: string
    required:
    - account_holder_name
    - account_number
    - bank_code
    type: object
  payment-service_pkg_response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Hệ thống thanh toán và ví điện tử - MindCare
  title: Payment Service API
  version: "1.0"
paths:
  /payments/bank-accounts:
    get:
      description: Retrieve all linked bank accounts for the current expert. Requires
        EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: User Role (EXPERT)
        in: header
        name: X-User-Role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[EXPERT] Get linked bank accounts'
      tags:
      - Withdrawals & Bank Accounts
    post:
      consumes:
      - application/json
      description: Link a new bank account for withdrawals. Requires EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: User Role (EXPERT)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Thông tin tài khoản ngân hàng để liên kết
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_withdrawal_handler.LinkBankAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[EXPERT] Link a new bank account'
      tags:
      - Withdrawals & Bank Accounts
  /payments/orders:
    post:
      consumes:
      - application/json
      description: Create a payment order for an appointment. Returns the payment
        URL (e.g. VNPay checkout). Requires PATIENT role or internal call from Booking
        Service.
      parameters:
      - description: Thông tin khởi tạo giao dịch thanh toán
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payment_handler.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/payment-service_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_payment_handler.CreateOrderResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[PATIENT/SYSTEM] Create a new payment order'
      tags:
      - Payment Orders
  /payments/vnpay-ipn:
    get:
      description: 'VNPay calls this API to update the payment status of an order.
        Role: Public (no token required, verifies checksum).'
      parameters:
      - description: VNPay automated response parameters
        in: query
        name: queryParams
        type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[PUBLIC/WEBHOOK] Receive VNPay payment webhook (IPN)'
      tags:
      - Payment Orders
  /payments/wallets/history:
    get:
      consumes:
      - application/json
      description: Retrieve the list of transactions (balance changes) for the current
        user's wallet, sorted by latest time. Requires PATIENT or EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: User Role (PATIENT hoặc EXPERT)
        in: header
        name: X-User-Role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/payment-service_pkg_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_wallet_handler.TxResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[PATIENT/EXPERT] Get transaction history'
      tags:
      - Wallets
  /payments/wallets/me:
    get:
      consumes:
      - application/json
      description: Retrieve wallet information (available balance, pending balance,
        locked balance) for the current user. Requires PATIENT or EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: User Role (PATIENT hoặc EXPERT)
        in: header
        name: X-User-Role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[PATIENT/EXPERT] Get current user''s wallet'
      tags:
      - Wallets
  /payments/wallets/top-up:
    post:
      consumes:
      - application/json
      description: Directly top up the available balance of the current user's wallet.
        Requires PATIENT or EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: Thông tin nạp tiền
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_wallet_handler.TopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[PATIENT/EXPERT] Top up wallet (Dev/Test only)'
      tags:
      - Wallets
  /payments/withdrawals:
    post:
      consumes:
      - application/json
      description: Request a withdrawal to a linked bank account. Amounts < 5,000,000
        VND are auto-approved. Requires EXPERT role.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: User Role (EXPERT)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Thông tin yêu cầu rút tiền
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_withdrawal_handler.CreateWithdrawalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[EXPERT] Request a withdrawal'
      tags:
      - Withdrawals & Bank Accounts
  /payments/withdrawals/{id}/approve:
    post:
      consumes:
      - application/json
      description: Admin approves a pending withdrawal request. Funds are transferred
        via Payout Gateway. Requires ADMIN role.
      parameters:
      - description: Admin ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: Admin Role (ADMIN)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Mã yêu cầu rút tiền (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin ghi chú duyệt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_withdrawal_handler.AdminProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[ADMIN] Approve withdrawal request'
      tags:
      - Admin - Withdrawals
  /payments/withdrawals/{id}/reject:
    post:
      consumes:
      - application/json
      description: Admin rejects a pending withdrawal request. Locked funds are returned
        to the expert's wallet. Requires ADMIN role.
      parameters:
      - description: Admin ID (UUID)
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: Admin Role (ADMIN)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Mã yêu cầu rút tiền (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Lý do từ chối (bắt buộc)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_withdrawal_handler.AdminProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payment-service_pkg_response.Response'
      summary: '[ADMIN] Reject withdrawal request'
      tags:
      - Admin - Withdrawals
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
