[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is built at runtime in migrations/env.py from the same
# DB_URL / DB_USER / DB_PASSWORD / DB_NAME / DB_SSLMODE / DB_PORT env vars
# used by app/database.py, so it is intentionally left blank here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
