basePath: /
definitions:
  AdminProfile:
    properties:
      email:
        type: string
      note:
        type: string
      profile_id:
        type: string
    type: object
  BaseResponse:
    properties:
      message:
        type: string
      result: {}
      statusCode:
        type: integer
      timestamp:
        type: string
    type: object
  CreateMedicalHistoryRequest:
    properties:
      condition_name:
        type: string
      description:
        type: string
      diagnosed_at:
        description: 'Định dạng: YYYY-MM-DD'
        type: string
      is_chronic:
        type: boolean
    required:
    - condition_name
    - diagnosed_at
    type: object
  CreateProfileRequest:
    properties:
      auth_id:
        type: string
      date_of_birth:
        description: 'Định dạng: YYYY-MM-DD (tuỳ chọn)'
        type: string
      email:
        type: string
      full_name:
        type: string
      role:
        enum:
        - ADMIN
        - EXPERT
        - PATIENT
        type: string
    required:
    - auth_id
    - full_name
    - role
    type: object
  CreateSpecializationRequest:
    properties:
      code:
        maxLength: 50
        type: string
      description:
        type: string
      image_url:
        type: string
      location:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 255
        type: string
      symptoms:
        items:
          type: string
        type: array
    required:
    - code
    - name
    - symptoms
    type: object
  ErrorResult:
    properties:
      error:
        type: string
    type: object
  ExpertProfile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      introduction_video_url:
        type: string
      profile_id:
        type: string
      specializations:
        description: 'Quan hệ N-N: Chuyên gia và Chuyên khoa (GORM tự tạo bảng trung
          gian)'
        items:
          $ref: '#/definitions/Specialization'
        type: array
      verification_status:
        type: string
    type: object
  MedicalHistory:
    properties:
      condition_name:
        type: string
      description:
        type: string
      diagnosed_at:
        type: string
      history_id:
        type: string
      is_active:
        type: boolean
      is_chronic:
        type: boolean
      patient_profile_id:
        type: string
    type: object
  PageResult-profile-service_internal_infrastructure_persistence_models_Profile:
    properties:
      hasNext:
        type: boolean
      hasPrevious:
        type: boolean
      items:
        items:
          $ref: '#/definitions/Profile'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  PatchExpertRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      introduction_video_url:
        type: string
      specialization_ids:
        items:
          type: string
        type: array
      user_information:
        $ref: '#/definitions/PatchUserInformationRequest'
      verification_status:
        enum:
        - UNVERIFIED
        - PENDING
        - VERIFIED
        - REJECTED
        type: string
    type: object
  PatchPatientRequest:
    properties:
      address:
        type: string
      avatar_url:
        type: string
      email:
        type: string
      user_information:
        $ref: '#/definitions/PatchUserInformationRequest'
    type: object
  PatchProfileRequest:
    properties:
      user_information:
        $ref: '#/definitions/PatchUserInformationRequest'
    type: object
  PatchUserInformationRequest:
    properties:
      country:
        maxLength: 100
        type: string
      date_of_birth:
        type: string
      full_name:
        minLength: 1
        type: string
      gender:
        enum:
        - MALE
        - FEMALE
        - OTHER
        type: string
      phone_number:
        maxLength: 20
        type: string
    type: object
  PatientProfile:
    properties:
      address:
        type: string
      avatar_url:
        type: string
      email:
        type: string
      medical_histories:
        items:
          $ref: '#/definitions/MedicalHistory'
        type: array
      profile_id:
        type: string
    type: object
  Profile:
    properties:
      admin_profile:
        $ref: '#/definitions/AdminProfile'
      auth_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      expert_profile:
        $ref: '#/definitions/ExpertProfile'
      id:
        type: string
      patient_profile:
        $ref: '#/definitions/PatientProfile'
      role:
        $ref: '#/definitions/Role'
      slug:
        type: string
      updated_at:
        type: string
      user_information:
        $ref: '#/definitions/UserInformation'
    type: object
  Role:
    enum:
    - ADMIN
    - EXPERT
    - PATIENT
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleExpert
    - RolePatient
  Specialization:
    properties:
      code:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      location:
        type: string
      name:
        type: string
      slug:
        type: string
      spec_id:
        type: string
      symptoms:
        items:
          type: string
        type: array
    type: object
  UpdateProfileRequest:
    properties:
      user_information:
        $ref: '#/definitions/UserInformationRequest'
    type: object
  UpsertExpertRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      introduction_video_url:
        type: string
      specialization_ids:
        items:
          type: string
        type: array
      user_information:
        $ref: '#/definitions/UserInformationRequest'
    type: object
  UpsertPatientRequest:
    properties:
      address:
        type: string
      avatar_url:
        type: string
      email:
        type: string
      user_information:
        $ref: '#/definitions/UserInformationRequest'
    type: object
  UserInformation:
    properties:
      country:
        type: string
      date_of_birth:
        type: string
      full_name:
        type: string
      gender:
        type: string
      phone_number:
        type: string
    type: object
  UserInformationRequest:
    properties:
      country:
        maxLength: 100
        type: string
      date_of_birth:
        description: 'Định dạng: YYYY-MM-DD, rỗng = không khai báo'
        type: string
      full_name:
        type: string
      gender:
        enum:
        - MALE
        - FEMALE
        - OTHER
        type: string
      phone_number:
        maxLength: 20
        type: string
    required:
    - full_name
    type: object
info:
  contact: {}
  description: Hồ sơ người dùng (Admin/Patient/Expert) - MindCare
  title: Profile Service API
  version: "1.0"
paths:
  /api/v1/profiles:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Lọc theo vai trò (ADMIN, EXPERT, PATIENT)
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
      security:
      - BearerAuth: []
      summary: '[Admin] Danh sách toàn bộ profile'
      tags:
      - profiles
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Tạo mới một profile'
      tags:
      - profiles
  /api/v1/profiles/{id}:
    delete:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xoá (mềm) một profile'
      tags:
      - profiles
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xem chi tiết 1 profile'
      tags:
      - profiles
    patch:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PatchProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật một phần thông tin profile'
      tags:
      - profiles
    put:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin người dùng mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật thông tin người dùng của profile'
      tags:
      - profiles
  /api/v1/profiles/experts:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Tìm theo tên
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
      summary: Danh sách chuyên gia
      tags:
      - experts
  /api/v1/profiles/experts/{id}:
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      summary: Xem chi tiết chuyên gia
      tags:
      - experts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Các trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PatchExpertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật một phần hồ sơ chuyên gia'
      tags:
      - experts
    put:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Hồ sơ chuyên gia
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpsertExpertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật toàn bộ hồ sơ chuyên gia'
      tags:
      - experts
  /api/v1/profiles/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: Xem hồ sơ của chính mình
      tags:
      - profiles
    patch:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật một phần hồ sơ của chính mình
      tags:
      - profiles
    put:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật toàn bộ hồ sơ của chính mình
      tags:
      - profiles
  /api/v1/profiles/me/medical-histories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: Xem tiền sử bệnh của chính mình
      tags:
      - patients
    post:
      consumes:
      - application/json
      parameters:
      - description: Tiền sử bệnh
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateMedicalHistoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: Thêm tiền sử bệnh cho chính mình
      tags:
      - patients
  /api/v1/profiles/patients:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Tìm theo tên
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
      security:
      - BearerAuth: []
      summary: '[Admin] Danh sách bệnh nhân'
      tags:
      - patients
  /api/v1/profiles/patients/{id}:
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xem chi tiết bệnh nhân'
      tags:
      - patients
    patch:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Các trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PatchPatientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật một phần hồ sơ bệnh nhân'
      tags:
      - patients
    put:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Hồ sơ bệnh nhân
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpsertPatientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật toàn bộ hồ sơ bệnh nhân'
      tags:
      - patients
  /api/v1/profiles/patients/{id}/medical-histories:
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xem tiền sử bệnh của một bệnh nhân'
      tags:
      - patients
  /api/v1/profiles/public/{id}:
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/BaseResponse'
      summary: Xem chi tiết 1 profile công khai
      tags:
      - profiles
  /api/v1/profiles/specializations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/Specialization'
                  type: array
              type: object
      summary: Danh sách chuyên khoa
      tags:
      - specializations
    post:
      consumes:
      - application/json
      description: code và slug là duy nhất; slug bỏ trống sẽ được sinh tự động từ
        name.
      parameters:
      - description: Chuyên khoa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateSpecializationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/Specialization'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/ErrorResult'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/ErrorResult'
              type: object
      security:
      - BearerAuth: []
      summary: '[Admin] Tạo chuyên khoa mới'
      tags:
      - specializations
  /internal/api/v1/profiles/create:
    post:
      consumes:
      - application/json
      description: auth-service gọi endpoint này (qua mạng nội bộ, không qua Gateway)
        ngay sau khi tạo tài khoản.
      parameters:
      - description: Thông tin tài khoản mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/BaseResponse'
      summary: '[Internal] Tạo profile khi có tài khoản mới'
      tags:
      - internal
  /internal/api/v1/profiles/sync-seed-authors:
    post:
      description: Lấy ID của expert hiện tại và publish qua RabbitMQ để forum-service
