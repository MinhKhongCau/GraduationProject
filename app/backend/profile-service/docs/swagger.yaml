      tags:
      - patients
  /api/v1/profiles/specializations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_pkg_response.Response'
      summary: Danh sách chuyên khoa
      tags:
      - specializations
    post:
      consumes:
      - application/json
      parameters:
      - description: Chuyên khoa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_schemas.CreateSpecializationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/profile-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: '[Admin] Tạo chuyên khoa mới'
      tags:
      - specializations
  /internal/api/v1/profiles/create:
    post:
      consumes:
      - application/json
      description: auth-service gọi endpoint này (qua mạng nội bộ, không qua Gateway)
        ngay sau khi tạo tài khoản.
      parameters:
      - description: Thông tin tài khoản mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_schemas.CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/profile-service_pkg_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_pkg_response.Response'
        "409":
