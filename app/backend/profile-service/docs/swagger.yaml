info:
  contact: {}
  description: Hồ sơ người dùng (Admin/Patient/Expert) - MindCare
  title: Profile Service API
  version: "1.0"
paths:
  /api/v1/profiles:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Lọc theo vai trò (ADMIN, EXPERT, PATIENT)
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/profile-service_internal_infrastructure_http_response.PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
      security:
      - BearerAuth: []
      summary: '[Admin] Danh sách toàn bộ profile'
      tags:
      - profiles
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_infrastructure_http_schemas.CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Tạo mới một profile'
      tags:
      - profiles
  /api/v1/profiles/{id}:
    delete:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xoá (mềm) một profile'
      tags:
      - profiles
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Xem chi tiết 1 profile'
      tags:
      - profiles
    patch:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_infrastructure_http_schemas.PatchProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật một phần thông tin profile'
      tags:
      - profiles
    put:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin người dùng mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_infrastructure_http_schemas.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật thông tin người dùng của profile'
      tags:
      - profiles
  /api/v1/profiles/{id}/avatar:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Tải ảnh lên S3 và lưu URL trả về vào avatar_url của hồ sơ bệnh nhân/chuyên gia.
        Bấm "Authorize" và nhập "Bearer <access_token>" trước khi thử.
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Ảnh JPEG, PNG, GIF hoặc WebP, tối đa 5 MB
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_infrastructure_http_handlers.AvatarUploadResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Tải lên ảnh đại diện
      tags:
      - profiles
  /api/v1/profiles/experts:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Tìm theo tên
        in: query
        name: search
        type: string
      - description: Lọc theo chuyên khoa (spec_id)
        in: query
        name: specialization_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/profile-service_internal_infrastructure_http_response.PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      summary: Danh sách chuyên gia
      tags:
      - experts
  /api/v1/profiles/experts/{id}:
    get:
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      summary: Xem chi tiết chuyên gia
      tags:
      - experts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Các trường cần cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_infrastructure_http_schemas.PatchExpertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật một phần hồ sơ chuyên gia'
      tags:
      - experts
    put:
      consumes:
      - application/json
      parameters:
      - description: Auth Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Hồ sơ chuyên gia
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/profile-service_internal_infrastructure_http_schemas.UpsertExpertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Cập nhật toàn bộ hồ sơ chuyên gia'
      tags:
      - experts
  /api/v1/profiles/experts/managed:
    get:
      parameters:
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số dòng/trang
        in: query
        name: page_size
        type: integer
      - description: Tìm theo tên
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/profile-service_internal_infrastructure_http_response.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/profile-service_internal_infrastructure_http_response.PageResult-profile-service_internal_infrastructure_persistence_models_Profile'
              type: object
        "401":
