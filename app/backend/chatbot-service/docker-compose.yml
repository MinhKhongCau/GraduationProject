services:
  pgvector_db:
    image: ankane/pgvector:latest
    container_name: mental_wellness_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: wellness_bot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-service
    restart: always
    ports:
      - "8086:8086"
    depends_on:
      - pgvector_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_HOST: pgvector_db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wellness_bot_db
      FASTTEXT_LID_MODEL_PATH: /models/language/lid.176.ftz
      TRANSLATION_MODEL_PATH: /models/translation/m2m100_418M
    volumes:
      - ./data:/workspace/data
      - fasttext_model:/models/language:ro
      - translation_model:/models/translation:ro

volumes:
  pgdata:

  fasttext_model:
    external: true
    name: chatbot_fasttext_model

  translation_model:
    external: true
    name: chatbot_translation_model
